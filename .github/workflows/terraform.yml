name: Terraform

on:
  pull_request:
    paths:
      - "data/**"
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: |
          if [ -n "${TF_CLOUD_ORGANIZATION}" ]; then
            cat > backend.ci.tf <<EOF
terraform {
  cloud {
    organization = "${TF_CLOUD_ORGANIZATION}"
    workspaces {
      tags = ["redhat-cop-dev-org"]
    }
  }
}
EOF
            terraform init
          else
            terraform init -backend=false
          fi

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: vars.TF_CLOUD_ORGANIZATION != ''
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_github_token: ${{ secrets.GH_ORG_ADMIN_TOKEN }}
          TF_VAR_billing_email: ${{ secrets.ORG_BILLING_EMAIL }}

      - name: Upload Plan
        if: (github.event_name == 'pull_request' || github.event_name == 'schedule') && vars.TF_CLOUD_ORGANIZATION != ''
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/plan.txt
          retention-days: 7

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request' && vars.TF_CLOUD_ORGANIZATION != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            const body = `#### Terraform Plan

            <details><summary>Show Plan</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            *Pusher: @${context.actor}, Action: \`${context.eventName}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan
        env:
          TF_VAR_github_token: ${{ secrets.GH_ORG_ADMIN_TOKEN }}
          TF_VAR_billing_email: ${{ secrets.ORG_BILLING_EMAIL }}
